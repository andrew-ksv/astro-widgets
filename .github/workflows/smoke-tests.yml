name: Playwright Smoke Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://${{ env.VERCEL_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright Smoke Tests (Chromium only)
        run: npx playwright test tests/e2e/smok --project=chromium --reporter=list